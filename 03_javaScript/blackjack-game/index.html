<!doctype html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="index.css" />
    <title>Black Jack Game</title>
  </head>
  <body>
    <main class="border-2px">
      <section class="header">
        <h1 class="title montserrat txt-golddark">BLACK JACK</h1>

        <section class="profile border-1px bg-black">
          <div class="profile-box">
            <h2 class="profile-title sub-txt">PLAYER</h2>
            <span class="profile-info montserrat main-txt">NITIN</span>
          </div>
          <div class="divider border-1px"></div>
          <div class="profile-box">
            <h2 class="profile-title sub-txt">CHIPS</h2>
            <span class="profile-info montserrat txt-gold">100</span>
          </div>
        </section>
      </section>

      <section class="hero">
        <div class="heading">
          <div class="border-1px"></div>
          <span class="txt-gold">YOUR CARDS</span>
          <div class="border-1px"></div>
        </div>

        <div class="cards border-2px">
          <span id="cards-el" class="card montserrat main-txt"></span>
        </div>

        <div class="heading">
          <div class="border-1px"></div>
          <span class="txt-gold">TOTAL</span>
          <div class="border-1px"></div>
        </div>

        <div class="total-window bg-black border-1px">
          <span id="total-el" class="montserrat main-txt">0</span>
        </div>

        <div class="message bg-black border-1px">
          <span id="message-el" class="montserrat main-txt"
            >Click "Start Game" to begin!!
          </span>
        </div>

        <div class="btn-wrapper">
          <button
            id="start-btn"
            class="btn border-1px bg-green main-txt"
            onclick="startGame()"
          >
            START GAME
          </button>
          <button
            id="newcard-btn"
            class="btn border-1px bg-red main-txt"
            onclick="newCard()"
          >
            ADD NEW CARD
          </button>
        </div>
      </section>
    </main>

    <script src="index.js"></script>
  </body>
</html>
