<!doctype html>
<html>
  <head>
    <title>Registration Form</title>
  </head>

  <body>
    <h2>Register Your Details</h2>
    <main>
      <form action="#">
        <section>
          <label for="name">Enter your full name</label>
          <input type="text" id="name" placeholder="Ex. Nitin Gosai" />
        </section>

        <section>
          <label for="email">Enter mail address</label>
          <input type="email" id="email" placeholder="Ex. xyz@abc.com" />
        </section>

        <section>
          <label for="password">Enter a password</label>
          <input type="password" id="password" />
        </section>

        <section>
          <label for="phone">Enter your phone number</label>
          <input type="tel" id="phone" />
        </section>

        <section>
          <label for="age">Enter age</label>
          <input type="number" id="age" />
        </section>

        <section>
          <label for="city">Enter your city</label>
          <input type="text" id="city" />
        </section>

        <section>
          <label>Select your gender</label>
          <ul>
            <li>
              <label for="male">Male:</label>
              <input type="radio" id="male" name="gender" />
            </li>
            <li>
              <label for="female">Female:</label>
              <input type="radio" id="female" name="gender" />
            </li>
            <li>
              <label for="other">Other:</label>
              <input type="radio" id="other" name="gender" />
            </li>
          </ul>
        </section>

        <section>
          <input type="checkbox" id="disability" />
          <label name="desable">Disability</label>
        </section>

        <section>
          <button>Submit</button>
        </section>
      </form>
    </main>
  </body>
</html>
