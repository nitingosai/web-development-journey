<!doctype html>
<html>
  <head>
    <title>Product Card</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <main class="main">
      <div class="content-wrapper">
        <section class="product-view">
          <img class="product-image" src="headphone.png" alt="Sony-Headphone" />
          <p class="discount-label">20% OFF</p>
        </section>

        <section class="product-action">
          <h1 class="product-name">Sony Wireless Headphone</h1>
          <div class="rating-box">
            <img
              class="rating-star"
              src="rating-star.png"
              alt="Rating Star Image"
            />
            <p class="reviews">(2K reviews)</p>
          </div>

          <div class="description">
            <p>
              Experience high quality sound with noise <br />
              cacellation and long lasting battery life.
            </p>
          </div>

          <div class="price-box">
            <p class="discount">₹1,999</p>
            <p class="MRP">₹2,499</p>
          </div>

          <button class="btn">
            <img
              class="shopping-cart"
              src="shopping-cart.png"
              alt="Shopping-Cart Icon"
            />
            <span class="text-btn">Add to Cart</span>
          </button>
        </section>
      </div>
    </main>
  </body>
</html>
