<!doctype html>
<html>
  <head>
    <title>Business Card</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <main class="main">
      <section class="profile">
        <img
          class="profile-pic"
          src="profile-image.png"
          alt="Profile image of Nitin Gosai"
        />
        <div class="name">
          <label>Nitin Gosai</label>
        </div>

        <div class="bio">
          <label>Frontend Developer</label>
        </div>

        <div class="devider"></div>

        <div class="about">
          <label>I build clean, responsive and user-friendly websites.</label>
        </div>
      </section>

      <section class="contact">
        <section class="contact-label-wrapper">
          <div class="contact-label">
            <img class="icon" src="user.png" alt="User-Icon" />

            <div class="info">
              <div>
                <label class="info-heading">Name</label>
              </div>

              <div>
                <label class="info-details">Nitin Gosai</label>
              </div>
            </div>
          </div>

          <div class="contact-label">
            <img class="icon" src="mail.png" alt="Email-Icon" />

            <div class="info">
              <div>
                <label class="info-heading">Email</label>
              </div>

              <div>
                <label class="info-details">nitingosai@gmail.com</label>
              </div>
            </div>
          </div>

          <div class="contact-label">
            <img class="icon" src="telephone.png" alt="Telephone-Icon" />

            <div class="info">
              <div>
                <label class="info-heading">Phone</label>
              </div>

              <div>
                <label class="info-details">91+ 111111111</label>
              </div>
            </div>
          </div>

          <div class="contact-label">
            <img class="icon" src="location.png" alt="Location-Icon" />

            <div class="info">
              <div>
                <label class="info-heading">Location</label>
              </div>

              <div>
                <label class="info-details">Gujarat, India</label>
              </div>
            </div>
          </div>
        </section>

        <section>
          <div class="devider"></div>

          <div class="social-platforms">
            <a href="https://www.linkedin.com/" target="_blank">
              <img class="social-icon" src="linkedin.svg" alt="LinkedIn-Icon" />
            </a>

            <a href="https://github.com/nitingosai" target="_blank">
              <img class="social-icon" src="github.svg" alt="GitHub-Icon" />
            </a>

            <a href="https://www.instagram.com/" target="_blank">
              <img class="social-icon" src="instagram.svg" alt="Instagram-Icon" />
            </a>

            <a href="https://nitingosai.netlify.app/" target="_blank">
              <img class="social-icon" src="dribbble.svg" alt="Website-Icon" />
            </a>
          </div>
        </section>
      </section>
    </main>
  </body>
</html>
